services:
  # MCP Server with auto-restart on code changes
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    container_name: clickup-mcp-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Asia/Kolkata
      - CLICKUP_API_TOKEN=${CLICKUP_API_TOKEN}
      - DATABASE_URL=${DATABASE_URL:-}
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - CLICKUP_TEAM_ID=${CLICKUP_TEAM_ID:-}
      - REPORTS_DIR=/app/reports
      # MCP fetch tuning (latency vs API pressure). Defaults are conservative.
      - CLICKUP_TIME_ENTRIES_CACHE_TTL_S=${CLICKUP_TIME_ENTRIES_CACHE_TTL_S:-300}
      - CLICKUP_TASK_FETCH_MAX_WORKERS=${CLICKUP_TASK_FETCH_MAX_WORKERS:-10}
      - CLICKUP_TIME_ENTRIES_MAX_WORKERS=${CLICKUP_TIME_ENTRIES_MAX_WORKERS:-60}
    volumes:
      - ./clickup_mcp:/app/clickup_mcp
      - ./app:/app/app
      - ./monitoring_config.json:/app/monitoring_config.json
      - ./project_map.json:/app/project_map.json
      - ./report_spaces_config.json:/app/report_spaces_config.json
      - reports:/app/reports
    networks:
      - clickup-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -m 3 -o /dev/null http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - watchmedo
      - auto-restart
      # Only restart MCP server when its own Python sources change.
      # Watching *.json or *.md caused both containers to restart during report runs.
      - --patterns=*.py
      - --directory=/app/clickup_mcp
      - --recursive
      - --ignore-patterns=*/__pycache__/*;*.pyc
      - "--"
      - python
      - -m
      - clickup_mcp.server
    develop:
      watch:
        - path: ./clickup_mcp
          action: sync+restart
          target: /app/clickup_mcp
        - path: ./requirements.txt
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

  # API Server - REST endpoint for browser queries
  api-server:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    container_name: clickup-api-server
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - TZ=Asia/Kolkata
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-qwen/qwen-2.5-7b-instruct}
      - OPENROUTER_MODEL_CHAIN=${OPENROUTER_MODEL_CHAIN:-}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-ClickUp MCP}
      - TASK_REPORT_POLL_INTERVAL_S=${TASK_REPORT_POLL_INTERVAL_S:-1.5}
      - TASK_REPORT_POLL_TIMEOUT_S=${TASK_REPORT_POLL_TIMEOUT_S:-300}
      # For /report/space direct mode, use isolated clients to allow safe parallel jobs.
      - REPORT_DIRECT_ISOLATED_CLIENT=${REPORT_DIRECT_ISOLATED_CLIENT:-true}
      - CLICKUP_API_TOKEN=${CLICKUP_API_TOKEN}
      - DATABASE_URL=${DATABASE_URL:-}
      # SMTP for dashboard action: POST /reports/send
      - SMTP_EMAIL=${SMTP_EMAIL:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TO=${SMTP_TO:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - REPORTS_DIR=/app/reports
    volumes:
      - ./api_server.py:/app/api_server.py
      - ./openrouter_client.py:/app/openrouter_client.py
      - ./openrouter_system_prompt.md:/app/openrouter_system_prompt.md
      - ./lm_studio_system_prompt.md:/app/lm_studio_system_prompt.md
      - ./reports_supabase.py:/app/reports_supabase.py
      - ./clickup_mcp:/app/clickup_mcp
      - ./app:/app/app
      - reports:/app/reports
    networks:
      - clickup-net
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -m 3 -o /dev/null http://localhost:8003/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command:
      - watchmedo
      - auto-restart
      # Watch only the two Python files and system-prompt MDs directly in /app.
      # No --recursive so *.py under clickup_mcp/ and *.md under reports/ never trigger a restart.
      - --patterns=*.py;*.md
      - --directory=/app
      - --ignore-patterns=*/__pycache__/*;*.pyc
      - "--"
      - python
      - api_server.py
    develop:
      watch:
        - path: ./requirements.txt
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

  # AI Client (OpenRouter) - runs interactively
  # Start manually with: docker compose --profile interactive up ai-client
  ai-client:
    profiles: [interactive]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ./.env
    container_name: clickup-ai-client
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-qwen/qwen-2.5-7b-instruct}
      - OPENROUTER_MODEL_CHAIN=${OPENROUTER_MODEL_CHAIN:-}
      - OPENROUTER_HTTP_REFERER=${OPENROUTER_HTTP_REFERER:-}
      - OPENROUTER_APP_TITLE=${OPENROUTER_APP_TITLE:-ClickUp MCP}
      - TASK_REPORT_POLL_INTERVAL_S=${TASK_REPORT_POLL_INTERVAL_S:-1.5}
      - TASK_REPORT_POLL_TIMEOUT_S=${TASK_REPORT_POLL_TIMEOUT_S:-300}
      - REPORTS_DIR=/app/reports
    volumes:
      - ./openrouter_client.py:/app/openrouter_client.py
      - ./openrouter_system_prompt.md:/app/openrouter_system_prompt.md
      - ./clickup_mcp:/app/clickup_mcp
      - ./app:/app/app
      - reports:/app/reports
    networks:
      - clickup-net
    depends_on:
      mcp-server:
        condition: service_healthy
    command: sh -c "sleep 5 && python -m clickup_mcp.client"
    develop:
      watch:
        - path: ./openrouter_client.py
          action: sync+restart
          target: /app/openrouter_client.py
        - path: ./openrouter_system_prompt.md
          action: sync+restart
          target: /app/openrouter_system_prompt.md
        - path: ./clickup_mcp
          action: sync+restart
          target: /app/clickup_mcp
        - path: ./lm_studio_system_prompt.md
          action: rebuild
        - path: ./requirements.txt
          action: rebuild
        - path: ./Dockerfile
          action: rebuild

  # Motia Reports — automated email reports via iii engine
  motia-reports:
    build:
      context: .
      dockerfile: Dockerfile.motia
    env_file:
      - ./.env
    container_name: clickup-motia-reports
    restart: unless-stopped
    ports:
      - "3111:3111"
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Kolkata
      - CLICKUP_API_TOKEN=${CLICKUP_API_TOKEN}
      - CLICKUP_TEAM_ID=${CLICKUP_TEAM_ID:-3301011}
      - SMTP_EMAIL=${SMTP_EMAIL:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_TO=${SMTP_TO:-aryapatel.eng@gmail.com}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      # Direct mode + isolated API clients allows safe parallel generation.
      - REPORT_CONCURRENCY=${REPORT_CONCURRENCY:-2}
      - REPORT_API_MODE=${REPORT_API_MODE:-direct}
      # Disable support-ticket cron noise unless explicitly needed.
      - SUPPORT_CRONS_ENABLED=${SUPPORT_CRONS_ENABLED:-false}
      # Points to the api-server which uses OpenRouter + MCP to generate reports
      # identical to what is shown on the localhost web UI
      - API_SERVER_URL=http://api-server:8003
      # Suppress noisy iii engine info/trace logs; use 'info' to re-enable
      - RUST_LOG=${RUST_LOG:-warn}
    volumes:
      - ./clickup-motia-reports/steps:/app/steps
      - ./monitoring_config.json:/app/monitoring_config.json:ro
      - ./report_spaces_config.json:/app/report_spaces_config.json:ro
      - motia-data:/app/data
    networks:
      - clickup-net
    depends_on:
      api-server:
        condition: service_healthy
    develop:
      watch:
        # Rebuild motia image when dependency/runtime definition changes.
        - path: ./Dockerfile.motia
          action: rebuild
        - path: ./clickup-motia-reports/pyproject.toml
          action: rebuild
        - path: ./clickup-motia-reports/uv.lock
          action: rebuild
        # Sync and restart container when iii engine config changes.
        - path: ./clickup-motia-reports/iii-config.yaml
          action: sync+restart
          target: /app/iii-config.yaml
volumes:
  reports:
    driver: local
  motia-data:
    driver: local

networks:
  clickup-net:
    driver: bridge
