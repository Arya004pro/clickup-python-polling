# ============================================================
# ClickUp MCP — PROJECT MANAGER COMPOSE FILE (EXAMPLE)
# ============================================================
# Real file name: docker-compose.pm.yml (gitignored)
#
# This setup uses:
# - public app images (mcp/api + motia)
# - private config image (contains mapping JSON files)
#
# To use:
#   1) Copy this file -> docker-compose.pm.yml
#   2) Fill in all FILL_... values
#   3) docker login (required to pull private config image)
#   4) docker compose -f docker-compose.pm.yml up
# ============================================================

services:
  pm-config-seed:
    image: ${PM_CONFIG_IMAGE:-arya004/clickup-config-private:latest}
    container_name: clickup-pm-config-seed
    restart: "no"
    command:
      - sh
      - -c
      - |
        set -e
        mkdir -p /pm-config
        cp -f /seed/monitoring_config.json /pm-config/monitoring_config.json
        cp -f /seed/project_map.json /pm-config/project_map.json
        cp -f /seed/report_spaces_config.json /pm-config/report_spaces_config.json
        echo "private config copied"
    volumes:
      - pm-config:/pm-config

  mcp-server:
    image: ${PM_APP_IMAGE:-arya004/clickup-mcp-pm:latest}
    container_name: clickup-mcp-server
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
      - CLICKUP_API_TOKEN=FILL_YOUR_CLICKUP_TOKEN_HERE
      - CLICKUP_TEAM_ID=FILL_YOUR_TEAM_ID_HERE
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - REPORTS_DIR=/app/reports
    volumes:
      - reports:/app/reports
      - pm-config:/pm-config:ro
    networks:
      - clickup-net
    depends_on:
      pm-config-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -m 3 -o /dev/null http://localhost:8001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    command:
      - sh
      - -c
      - |
        cp -f /pm-config/monitoring_config.json /app/monitoring_config.json
        cp -f /pm-config/project_map.json /app/project_map.json
        cp -f /pm-config/report_spaces_config.json /app/report_spaces_config.json
        python -m clickup_mcp.server

  api-server:
    image: ${PM_APP_IMAGE:-arya004/clickup-mcp-pm:latest}
    container_name: clickup-api-server
    restart: unless-stopped
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Asia/Kolkata
      - MCP_SERVER_URL=http://mcp-server:8001/sse
      - CLICKUP_API_TOKEN=FILL_YOUR_CLICKUP_TOKEN_HERE
      - OPENROUTER_API_KEY=FILL_YOUR_OPENROUTER_KEY_HERE
      - OPENROUTER_BASE_URL=https://openrouter.ai/api/v1
      - OPENROUTER_MODEL=qwen/qwen-2.5-7b-instruct
      - OPENROUTER_MODEL_CHAIN=
      - EMAIL_TRANSPORT=brevo_api
      - BREVO_API_KEY=FILL_YOUR_BREVO_API_KEY_HERE
      - EMAIL_FROM=reports@yourdomain.com
      - EMAIL_FROM_NAME=Arya
      - SMTP_TO=FILL_TESTER_RECIPIENT_EMAIL_HERE
      - SMTP_EMAIL=
      - SMTP_PASSWORD=
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - REPORTS_DIR=/app/reports
    volumes:
      - reports:/app/reports
    networks:
      - clickup-net
    depends_on:
      mcp-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sS -m 3 -o /dev/null http://localhost:8003/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    command:
      - python
      - api_server.py

  motia-reports:
    image: ${PM_MOTIA_IMAGE:-arya004/clickup-motia:latest}
    container_name: clickup-motia-reports
    restart: unless-stopped
    ports:
      - "3111:3111"
    environment:
      - PYTHONPATH=/app
      - TZ=Asia/Kolkata
      - CLICKUP_API_TOKEN=FILL_YOUR_CLICKUP_TOKEN_HERE
      - CLICKUP_TEAM_ID=FILL_YOUR_TEAM_ID_HERE
      - EMAIL_TRANSPORT=brevo_api
      - BREVO_API_KEY=FILL_YOUR_BREVO_API_KEY_HERE
      - EMAIL_FROM=reports@yourdomain.com
      - EMAIL_FROM_NAME=Arya
      - SMTP_TO=FILL_TESTER_RECIPIENT_EMAIL_HERE
      - SMTP_EMAIL=
      - SMTP_PASSWORD=
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - API_SERVER_URL=http://api-server:8003
      - REPORT_CONCURRENCY=2
      - REPORT_API_MODE=llm
      - SUPPORT_CRONS_ENABLED=false
      - RUST_LOG=warn
    volumes:
      - motia-data:/app/data
      - pm-config:/pm-config:ro
    networks:
      - clickup-net
    depends_on:
      api-server:
        condition: service_healthy
      pm-config-seed:
        condition: service_completed_successfully
    command:
      - sh
      - -c
      - |
        cp -f /pm-config/monitoring_config.json /app/monitoring_config.json
        cp -f /pm-config/report_spaces_config.json /app/report_spaces_config.json
        iii -c iii-config.yaml

volumes:
  reports:
    driver: local
  motia-data:
    driver: local
  pm-config:
    driver: local

networks:
  clickup-net:
    driver: bridge
